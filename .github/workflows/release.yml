name: release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing: the job authenticates to npm with an OIDC token (no NPM_TOKEN),
  # and npm adds provenance. Each package lists this repo and release.yml as its trusted
  # publisher on npmjs.com, and its `repository.url` must match this repo.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # With pending changesets: opens or updates a "Version packages" PR.
      # Once that PR is merged: publishes the bumped packages to npm.
      - uses: changesets/action@v1
        with:
          publish: pnpm release
          title: Version packages
          commit: Version packages
        env:
          # No NPM_TOKEN: without one, changesets/action leaves .npmrc alone and pnpm 11's
          # `pnpm publish` uses trusted publishing (pnpm 10's never did).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
